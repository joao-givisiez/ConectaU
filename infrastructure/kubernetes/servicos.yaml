# Componentes sem estado: um Deployment (réplicas escaláveis) e um Service por componente.
# Segredos que entram numa URL usam a substituição $(VAR) do Kubernetes (variável definida antes na lista).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identidade
  labels:
    app: identidade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identidade
  template:
    metadata:
      labels:
        app: identidade
    spec:
      containers:
        - name: identidade
          image: conectau/identidade:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3101
          envFrom:
            - configMapRef:
                name: identidade-config
          env:
            - name: DB_SENHA
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: IDENTIDADE_DB_SENHA
            - name: JWT_SEGREDO
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: JWT_SEGREDO
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: ADMIN_EMAIL
            - name: ADMIN_SENHA
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: ADMIN_SENHA
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3101
            periodSeconds: 5
          # Liveness só verifica se o processo responde na porta: um banco fora do ar tira o pod
          # do balanceamento (readiness), mas não deve fazer o Kubernetes reiniciá-lo em loop.
          livenessProbe:
            tcpSocket:
              port: 3101
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: identidade
  labels:
    app: identidade
spec:
  selector:
    app: identidade
  ports:
    - port: 3101
      targetPort: 3101
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coleta
  labels:
    app: coleta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coleta
  template:
    metadata:
      labels:
        app: coleta
    spec:
      containers:
        - name: coleta
          image: conectau/coleta:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3102
          envFrom:
            - configMapRef:
                name: coleta-config
          env:
            - name: COLETA_DB_SENHA
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: COLETA_DB_SENHA
            - name: TOKEN_SERVICO
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: TOKEN_SERVICO
            - name: MONGO_URL
              value: "mongodb://coleta:$(COLETA_DB_SENHA)@coleta-db:27017/coleta?authSource=coleta"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3102
            periodSeconds: 5
          # Liveness só verifica se o processo responde na porta: um banco fora do ar tira o pod
          # do balanceamento (readiness), mas não deve fazer o Kubernetes reiniciá-lo em loop.
          livenessProbe:
            tcpSocket:
              port: 3102
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 4
---
apiVersion: v1
kind: Service
metadata:
  name: coleta
  labels:
    app: coleta
spec:
  selector:
    app: coleta
  ports:
    - port: 3102
      targetPort: 3102
