# Servidor dos arquivos estáticos do cliente (nginx sem root, porta 8080).
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Sempre revalida HTML, JS e CSS: uma nova versão da imagem aparece sem limpar o cache.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
