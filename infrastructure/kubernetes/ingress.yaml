apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conectau-ingress
  namespace: conectau
spec:
  ingressClassName: traefik
  rules:
    - host: conectau.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: identidade
                port:
                  number: 3101
