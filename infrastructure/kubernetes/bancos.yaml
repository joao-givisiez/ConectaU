# Bancos e broker: um StatefulSet por instância, cada um com o próprio volume persistente
# (database per service). Nenhum banco é compartilhado entre serviços.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: identidade-db
  labels:
    app: identidade-db
spec:
  serviceName: identidade-db
  replicas: 1
  selector:
    matchLabels:
      app: identidade-db
  template:
    metadata:
      labels:
        app: identidade-db
    spec:
      containers:
        - name: identidade-db
          image: conectau/identidade-db:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "identidade"
            - name: POSTGRES_USER
              value: "identidade"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: IDENTIDADE_DB_SENHA
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: dados
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: identidade-db
  labels:
    app: identidade-db
spec:
  selector:
    app: identidade-db
  ports:
    - name: p5432
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coleta-db
  labels:
    app: coleta-db
spec:
  serviceName: coleta-db
  replicas: 1
  selector:
    matchLabels:
      app: coleta-db
  template:
    metadata:
      labels:
        app: coleta-db
    spec:
      containers:
        - name: coleta-db
          image: conectau/coleta-db:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "root"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: COLETA_DB_SENHA_ROOT
            - name: MONGO_INITDB_DATABASE
              value: "coleta"
            - name: COLETA_DB_USUARIO
              value: "coleta"
            - name: COLETA_DB_SENHA
              valueFrom:
                secretKeyRef:
                  name: conectau-segredos
                  key: COLETA_DB_SENHA
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: dados
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: coleta-db
  labels:
    app: coleta-db
spec:
  selector:
    app: coleta-db
  ports:
    - name: p27017
      port: 27017
      targetPort: 27017
