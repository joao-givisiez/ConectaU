# Configuração do RabbitMQ do ConectaU.
# O usuário padrão "guest" só aceita conexões locais; os serviços usam o usuário definido
# por RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS (vindos do .env ou do Secret).
loopback_users.guest = true

# Bloqueia publicadores antes de o disco encher, em vez de derrubar o broker.
disk_free_limit.absolute = 200MB

# Painel de gerenciamento (filas, filas de mortas, taxas de mensagens).
management.tcp.port = 15672
