# Servidor dos arquivos estáticos do front-end (nginx sem root, porta 8080).
# O gateway publica este serviço em /app/ e remove o prefixo antes de chegar aqui.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Fontes não mudam entre versões: cache longo. O resto sempre revalida,
  # para uma nova imagem aparecer sem limpar o cache do navegador.
  location /fontes/ {
    include /etc/nginx/seguranca.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    include /etc/nginx/seguranca.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
